name: Cohort data to Google Sheet

on:
  # Runs every day at 08:13 India time (02:43 UTC).
  # GitHub scheduled workflows run from the repository's default branch.
  schedule:
    - cron: "43 2 * * *"

  # A manual run always performs a FULL March-to-current refresh.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cohort-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      METABASE_URL: ${{ vars.METABASE_URL }}
      METABASE_DATABASE_ID: ${{ vars.METABASE_DATABASE_ID }}
      METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
      GOOGLE_SPREADSHEET_ID: "1RivYArY_zCFoHw5WhfD75HsxwYTo7hUvsMI-NknARbI"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_NAME: "Sheet1"
      START_DATE_IST: "2026-03-01"
      RECENT_START_DATE_IST: "2026-10-01"
      CHUNK_DAYS: "7"
      WRITE_BATCH_ROWS: "1500"
      DATASET_MAX_RESULTS: "500000"
      METABASE_TIMEOUT_SECONDS: "600"
      # Scheduled run = recent only. workflow_dispatch = full.
      RUN_MODE: ${{ github.event_name == 'schedule' && 'recent' || 'full' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Metabase to Google Sheets sync
        run: python sync_metabase_to_sheets.py
